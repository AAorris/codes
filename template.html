<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fragment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html {
      font-family: "Geist Mono", "Geist", monospace;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
    }

    body {
      max-width: 80ch;
      margin: auto;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    ul,
    li,
    table,
    tr,
    th,
    td,
    blockquote,
    figure,
    aside,
    pre {
      padding: 0;
      margin: 0;
      font-size: 14px;
      line-height: 1.75;
      border: none;
      border-spacing: 0;
    }

    th {
      text-align: left;
    }

    h1 {
      padding-top: 8px;
      font-size: 28px;
    }

    h2 {
      padding-top: 8px;
      font-size: 24px;
    }

    h3 {
      padding-top: 4px;
      font-size: 18px;
    }

    td {
      padding-right: 8px;
    }

    ul {
      padding-left: 20px;
    }

    blockquote {
      white-space: pre;
      border: 0px;
      border-left: 2px;
      padding-left: 12px;
      border-style: solid;
      border-color: #000;
    }
  </style>
</head>

<body>
  {body}
</body>

</html>
