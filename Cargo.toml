[package]
name = "dockersite"
version = "0.1.0"
edition = "2024"
default-run = "server"

# TLS and SigV4 for signed S3 Express reads (kernel/s3.rs); everything else is std.
[dependencies]
hmac = "0.12.1"
sha2 = "0.10.8"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[[bin]]
name = "server"
path = "kernel/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
